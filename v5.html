<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المتجر التجريبي...</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة السلايدر -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        :root {
            --primary: #000; /* ديناميكي */
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #1E293B;
            --radius: 12px;
            --font: 'Cairo', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); padding-bottom: 90px; }
        .app { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }

        /* === PAGE 1 STYLE (Modern App Look) === */
        .nav-bar {
            height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px;
            border-bottom: 1px solid #F1F5F9; background: #fff; position: sticky; top: 0; z-index: 50;
        }
        .nav-logo { height: 35px; object-fit: contain; }
        .nav-title { font-weight: 800; font-size: 1.1rem; color: var(--primary); }

        .product-gallery { width: 100%; aspect-ratio: 1/1; background: #f8f8f8; position: relative; }
        .swiper { width: 100%; height: 100%; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .swiper-pagination-bullet-active { background: var(--primary) !important; }
        
        .video-trigger {
            position: absolute; bottom: 15px; left: 15px; z-index: 10;
            background: rgba(0,0,0,0.8); color: #fff; padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; display: flex; align-items: center; gap: 5px; cursor: pointer; backdrop-filter: blur(4px);
        }

        .main-content { padding: 1.2rem; }
        .prod-title { font-size: 1.3rem; font-weight: 800; line-height: 1.4; margin-bottom: 0.5rem; }
        .prod-price { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; }
        .desc-text { color: #64748B; font-size: 0.95rem; line-height: 1.7; }

        .feat-item { display: flex; gap: 10px; margin-bottom: 0.8rem; font-size: 0.95rem; font-weight: 600; align-items: center; }
        .feat-item span { color: var(--primary); font-size: 1.2rem; }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
            background: rgba(255,255,255,0.95); padding: 12px 1.5rem; border-top: 1px solid #eee; z-index: 100;
        }
        .btn-main {
            width: 100%; background: var(--primary); color: #fff; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 1.1rem; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* === PAGE 2 STYLE (V1 Classic - Simple & Direct) === */
        .capture-container { padding: 3rem 1.5rem; text-align: center; }
        .success-icon { font-size: 4rem; display: block; margin-bottom: 1rem; animation: bounce 2s infinite; }
        .v1-headline { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: #0F172A; }
        .v1-sub { color: #64748B; margin-bottom: 2rem; }

        /* صندوق العرض (Marketing Plan Hook) */
        .offer-unlock-box {
            background: #F0FDF4; border: 2px dashed #4ADE80; padding: 1.5rem; border-radius: 16px; margin-bottom: 2rem;
        }
        .offer-text { color: #15803D; font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 1rem; justify-content: center; }
        .tab-btn {
            padding: 8px 16px; border-radius: 8px; border: 1px solid #E2E8F0; background: #fff; cursor: pointer; font-weight: 600;
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .input-wrapper { display: flex; gap: 8px; margin-bottom: 1rem; }
        .flag-select { padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; background: #fff; font-size: 1.2rem; }
        .v1-input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 1rem; outline: none; }
        .v1-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }

        /* قسم السؤال الأخير */
        .critical-question { margin-top: 3rem; border-top: 1px solid #eee; padding-top: 2rem; }

        /* Video Modal */
        .video-modal { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; align-items: center; justify-content: center; }
        .close-vid { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; cursor: pointer; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #loader { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="loader">Loading...</div>

    <!-- Video Modal -->
    <div id="video-modal" class="video-modal hidden">
        <div class="close-vid" onclick="closeVideo()">✕ إغلاق</div>
        <div id="video-frame-container" style="width:100%; aspect-ratio:16/9;"></div>
    </div>

    <!-- === PAGE 1: PRODUCT (V4 Style) === -->
    <div id="view-home" class="app">
        <nav class="nav-bar">
            <!-- سيظهر الشعار والاسم الوهمي هنا -->
            <img id="el-logo" class="nav-logo hidden">
            <span id="el-storename" class="nav-title"></span>
        </nav>

        <div class="product-gallery">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="img-wrapper"></div>
                <div class="swiper-pagination"></div>
            </div>
            <div id="btn-watch" class="video-trigger hidden" onclick="openVideo()">
                <span>▶</span> فيديو المنتج
            </div>
        </div>

        <div class="main-content">
            <h1 id="el-title" class="prod-title">...</h1>
            <div class="prod-price"><span id="el-price">...</span></div>

            <div style="background: #FEF2F2; color: #991B1B; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; border-right: 3px solid #EF4444;">
                🛑 <span id="el-pain" style="font-weight: 700;"></span>
            </div>

            <p id="el-desc" class="desc-text">...</p>

            <div style="margin-top: 1.5rem;">
                <div id="features-container"></div>
            </div>

            <!-- مسافة -->
            <div style="height: 60px;"></div>
        </div>

        <div class="bottom-bar">
            <button class="btn-main" onclick="goToCapture()">
                نعم، أنا مهتم
                <span style="font-size: 0.8rem; opacity: 0.8; font-weight: 400;">(بدون دفع)</span>
            </button>
        </div>
    </div>


    <!-- === PAGE 2: CAPTURE (V1 Style + Upgrades) === -->
    <div id="view-capture" class="app hidden">
        <div class="capture-container">
            <span class="success-icon">🎉</span>
            <h2 class="v1-headline">قرار ممتاز!</h2>
            <p class="v1-sub">أنت تملك ذوقاً رائعاً.</p>

            <!-- صندوق العرض (Marketing Hook) -->
            <div class="offer-unlock-box">
                <div id="offer-text" class="offer-text">...</div>
                <div style="font-size: 0.9rem; color: #15803D;">سجل بياناتك أدناه لتثبيت هذا العرض</div>
            </div>

            <!-- أدوات الإدخال -->
            <div class="tabs">
                <button class="tab-btn active" id="btn-email" onclick="setTab('email')">✉️ إيميل</button>
                <button class="tab-btn" id="btn-wa" onclick="setTab('whatsapp')">📱 واتساب</button>
            </div>

            <div id="field-email">
                <input type="email" id="inp-email" class="v1-input" placeholder="ضع بريدك الإلكتروني هنا...">
            </div>

            <div id="field-wa" class="hidden">
                <div class="input-wrapper">
                    <select id="country-code" class="flag-select">
                        <option value="+966">🇸🇦</option>
                        <option value="+971">🇦🇪</option>
                        <option value="+965">🇰🇼</option>
                        <option value="+974">🇶🇦</option>
                        <option value="+20">🇪🇬</option>
                    </select>
                    <input type="tel" id="inp-wa" class="v1-input" placeholder="رقم الموبايل...">
                </div>
            </div>

            <button onclick="submitLead()" class="btn-main" style="margin-top: 1rem;">
                أكمل التسجيل ✅
            </button>
            <div id="success-msg" class="hidden" style="color: green; font-weight: bold; margin-top: 10px;">تم الحفظ بنجاح!</div>

            <!-- السؤال الحاسم (Critical Question) -->
            <div class="critical-question">
                <p style="font-weight: 700; margin-bottom: 1rem;">سؤال أخير: لو توفر بسعر <span id="price-confirm" style="color: var(--primary);"></span>، هل ستشتريه؟</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="tab-btn" onclick="alert('شكراً!')">نعم</button>
                    <button class="tab-btn" onclick="alert('شكراً!')">ربما</button>
                    <button class="tab-btn" onclick="alert('شكراً!')">لا</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // === 1. قاعدة البيانات (Mock Data) ===
        const DB = {
            "demo": {
                // هوية وهمية تظهر فوراً
                meta: { name: "ترافل جير", logo: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png", color: "#2563EB" },
                product: {
                    title: "الحقيبة الذكية المانعة للسرقة",
                    price: "249 ر.س",
                    images: [
                        "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80",
                        "https://images.unsplash.com/photo-1622560480605-d83c852d5c91?w=800&q=80"
                    ],
                    video: "https://www.youtube.com/embed/dQw4w9WgXcQ", 
                    pain: "هل تخاف من السرقة في الزحام؟",
                    desc: "حقيبة ظهر بتصميم هندسي يمنع الفتح من الخلف. سافر وأنت مرتاح البال.",
                    features: ["سحابات مخفية", "مقاومة للماء", "منفذ USB"]
                },
                marketing: { offerHook: "خصم 20% خاص للإطلاق 🎁" }
            },
            
            "coffee": {
                meta: { name: "أريب كوفي", logo: "", color: "#78350F" },
                product: {
                    title: "الكوب الذكي - حرارة ثابتة",
                    price: "180 ر.س",
                    images: ["https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=800&q=80"],
                    video: "",
                    pain: "قهوتك تبرد بسرعة؟",
                    desc: "قاعدة تسخين ذكية تحافظ على حرارة مشروبك عند 55 درجة مئوية.",
                    features: ["تسخين تلقائي", "آمن", "سيراميك فاخر"]
                },
                marketing: { offerHook: "عرض 1 + 1 مجاناً لفترة محدودة 🔥" }
            }
        };

        // === 2. المنطق ===
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('store') || 'demo';
        const data = DB[storeId] || DB['demo'];
        let activeTab = 'email';

        function init() {
            // الألوان
            document.documentElement.style.setProperty('--primary', data.meta.color);

            // الهيدر (الشعار والاسم)
            if(data.meta.logo) {
                document.getElementById('el-logo').src = data.meta.logo;
                document.getElementById('el-logo').classList.remove('hidden');
            } else {
                document.getElementById('el-storename').innerText = data.meta.name;
            }

            // الصور
            const wrapper = document.getElementById('img-wrapper');
            data.product.images.forEach(img => {
                wrapper.innerHTML += `<div class="swiper-slide"><img src="${img}"></div>`;
            });
            new Swiper(".mySwiper", { pagination: { clickable: true }, loop: true });

            // الفيديو
            if(data.product.video) document.getElementById('btn-watch').classList.remove('hidden');

            // المحتوى
            document.getElementById('el-title').innerText = data.product.title;
            document.getElementById('el-price').innerText = data.product.price;
            document.getElementById('el-pain').innerText = data.product.pain;
            document.getElementById('el-desc').innerText = data.product.desc;
            
            // المميزات
            const featBox = document.getElementById('features-container');
            data.product.features.forEach(f => {
                featBox.innerHTML += `<div class="feat-item"><span>✔</span> ${f}</div>`;
            });

            // العرض في الصفحة 2
            document.getElementById('offer-text').innerText = data.marketing.offerHook;
            document.getElementById('price-confirm').innerText = data.product.price;

            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }

        // === 3. وظائف الفيديو ===
        function openVideo() {
            document.getElementById('video-frame-container').innerHTML = `<iframe width="100%" height="100%" src="${data.product.video}?autoplay=1" frameborder="0" allow="autoplay"></iframe>`;
            document.getElementById('video-modal').classList.remove('hidden');
        }
        function closeVideo() {
            document.getElementById('video-modal').classList.add('hidden');
            document.getElementById('video-frame-container').innerHTML = '';
        }

        // === 4. وظائف الصفحة 2 ===
        function goToCapture() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-capture').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function setTab(type) {
            activeTab = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(type === 'email') {
                document.getElementById('btn-email').classList.add('active');
                document.getElementById('field-email').classList.remove('hidden');
                document.getElementById('field-wa').classList.add('hidden');
            } else {
                document.getElementById('btn-wa').classList.add('active');
                document.getElementById('field-email').classList.add('hidden');
                document.getElementById('field-wa').classList.remove('hidden');
            }
        }

        function submitLead() {
            let val = activeTab === 'email' ? document.getElementById('inp-email').value : document.getElementById('inp-wa').value;
            if(val.length > 3) {
                document.getElementById('success-msg').classList.remove('hidden');
            } else {
                alert("بيانات غير صحيحة");
            }
        }

        init();
    </script>
</body>
</html>
