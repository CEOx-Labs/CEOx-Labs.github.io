<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحميل المتجر...</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* === متغيرات التصميم الديناميكية === */
        :root {
            --primary: #000; /* سيتغير تلقائياً */
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #0F172A;
            --text-light: #64748B;
            --border: #E2E8F0;
            --radius: 16px;
            --font: 'Cairo', sans-serif;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        /* === الأساسيات === */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* === الحاوية الرئيسية === */
        .app-container {
            max-width: 500px; margin: 0 auto; background: var(--surface);
            min-height: 100vh; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.05);
        }
        .hidden { display: none !important; }

        /* === الهيدر === */
        .header { padding: 1.2rem; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
        .logo-img { height: 40px; object-fit: contain; }
        .store-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); }

        /* === الفيديو والصور === */
        .hero-media { width: 100%; position: relative; background: #000; overflow: hidden; }
        /* جعل الفيديو بنسبة 16:9 سينمائي */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .hero-img { width: 100%; height: auto; display: block; }

        /* === المحتوى === */
        .content { padding: 1.5rem; }
        .badge { 
            display: inline-flex; align-items: center; gap: 5px;
            background: #F0FDFA; color: #0F766E; border: 1px solid #CCFBF1;
            padding: 6px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; margin-bottom: 1rem;
        }
        .headline { font-size: 1.5rem; font-weight: 800; line-height: 1.4; margin-bottom: 0.8rem; }
        .sub-headline { color: var(--text-light); font-size: 1rem; line-height: 1.6; }

        /* === نقاط الألم والمميزات === */
        .pain-card {
            background: #FEF2F2; border-right: 4px solid #EF4444;
            padding: 1.2rem; border-radius: 12px; margin: 2rem 0;
        }
        .features-list { list-style: none; margin-top: 1.5rem; }
        .features-list li {
            padding: 0.8rem 0; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; font-weight: 600;
        }
        .features-list li::before { content: "✔"; color: var(--primary); font-size: 1.2rem; }

        /* === العرض === */
        .offer-card {
            background: linear-gradient(135deg, #FFFBEB 0%, #FFF7ED 100%);
            border: 2px dashed #FCD34D; padding: 1.5rem; border-radius: var(--radius);
            text-align: center; margin-top: 2rem;
        }

        /* === الشريط السفلي الثابت === */
        .sticky-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            max-width: 500px; margin: 0 auto;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            padding: 1rem; border-top: 1px solid var(--border); z-index: 100;
        }
        .btn {
            width: 100%; padding: 1rem; border: none; border-radius: 12px;
            background: var(--primary); color: #fff;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }

        /* === صفحة التسجيل (Capture) === */
        .capture-box {
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1.5rem; margin-top: 1.5rem; box-shadow: var(--shadow);
        }
        
        /* التبويبات (Tabs) */
        .tabs { display: flex; background: #F1F5F9; padding: 4px; border-radius: 10px; margin-bottom: 1.5rem; }
        .tab { flex: 1; padding: 0.8rem; border: none; background: transparent; font-weight: 600; color: var(--text-light); border-radius: 8px; cursor: pointer; }
        .tab.active { background: #fff; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* حقول الإدخال الاحترافية */
        .input-group { margin-bottom: 1rem; }
        .input-wrapper { display: flex; gap: 10px; }
        
        /* قائمة الدول المنسدلة */
        .country-select {
            width: 100px; padding: 0.8rem; border: 2px solid var(--border);
            border-radius: 10px; background: #fff; font-family: var(--font); font-size: 1rem;
        }
        .main-input {
            flex: 1; padding: 0.8rem 1rem; border: 2px solid var(--border);
            border-radius: 10px; font-size: 1rem; font-family: var(--font);
            transition: 0.3s;
        }
        .main-input:focus { border-color: var(--primary); }

        /* === اللودر === */
        #loader { position: fixed; inset: 0; background: #fff; z-index: 999; display: flex; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader"><div class="spinner"></div></div>

    <!-- ===== الصفحة 1: عرض المنتج ===== -->
    <div id="view-1" class="app-container">
        
        <!-- الهيدر -->
        <header class="header">
            <img id="store-logo" class="logo-img hidden">
            <span id="store-name" class="store-title hidden"></span>
        </header>

        <!-- الميديا (فيديو أو صورة) -->
        <div class="hero-media">
            <!-- سيتم حقن الفيديو هنا إذا وجد -->
            <div id="video-box" class="video-container hidden"></div>
            <!-- الصورة الاحتياطية -->
            <img id="hero-image" class="hero-img" src="">
        </div>

        <!-- المحتوى -->
        <div class="content">
            <!-- شارة السوق -->
            <div id="badge-box" class="badge hidden">
                <span>🔥</span> <span id="market-signal"></span>
            </div>

            <h1 id="hero-title" class="headline">...</h1>
            <p id="hero-desc" class="sub-headline">...</p>

            <!-- كرت الألم -->
            <div class="pain-card">
                <div style="color: #991B1B; font-weight: 700; margin-bottom: 5px;">🛑 هل تعاني من <span id="pain-txt"></span>؟</div>
                <div style="font-size: 0.9rem; color: #7F1D1D;">الحل التقليدي مكلف. اكتشف الفرق الآن.</div>
            </div>

            <!-- المميزات -->
            <h3 style="font-weight: 700;">لماذا <span id="prod-name-small"></span>؟</h3>
            <ul id="features-list" class="features-list"></ul>

            <!-- العرض -->
            <div class="offer-card">
                <div id="offer-title" style="font-weight: 800; color: #B45309; font-size: 1.1rem;"></div>
                <div id="offer-sub" style="font-size: 0.9rem; color: #92400E; margin-top: 5px;"></div>
            </div>

            <!-- مسافة للشريط السفلي -->
            <div style="height: 60px;"></div>
        </div>

        <!-- الشريط السفلي الثابت -->
        <div class="sticky-bar">
            <button onclick="goToCapture()" class="btn">نعم، أنا مهتم (تجربة مجانية)</button>
            <div style="text-align: center; font-size: 0.75rem; color: #94A3B8; margin-top: 5px;">بدون التزام مالي حالياً</div>
        </div>
    </div>


    <!-- ===== الصفحة 2: التسجيل ===== -->
    <div id="view-2" class="app-container hidden">
        <div style="padding: 3rem 1.5rem; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
            <h2 class="headline">اختيار ذكي!</h2>
            <p class="sub-headline">أنت على بعد خطوة واحدة من تثبيت العرض الحصري.</p>

            <div class="capture-box">
                <div style="margin-bottom: 1rem; font-weight: 600;">أين نرسل لك إشعار التوفر؟</div>

                <!-- التبويبات -->
                <div class="tabs">
                    <button class="tab active" onclick="setTab('email')">📧 الإيميل</button>
                    <button class="tab" onclick="setTab('whatsapp')">📱 واتساب</button>
                </div>

                <!-- حقل الإيميل -->
                <div id="field-email" class="input-group">
                    <input type="email" id="inp-email" class="main-input" style="width: 100%;" placeholder="Example@gmail.com">
                </div>

                <!-- حقل الواتساب (مع الدول) -->
                <div id="field-whatsapp" class="input-group hidden">
                    <div class="input-wrapper">
                        <!-- قائمة الدول -->
                        <select id="country-code" class="country-select">
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+965">🇰🇼 +965</option>
                            <option value="+968">🇴🇲 +968</option>
                            <option value="+973">🇧🇭 +973</option>
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+962">🇯🇴 +962</option>
                        </select>
                        <input type="tel" id="inp-whatsapp" class="main-input" placeholder="5xxxxxxx">
                    </div>
                </div>

                <button onclick="submitLead()" class="btn">ثبت العرض الآن 🚀</button>
                
                <div id="success-msg" class="hidden" style="margin-top: 1rem; color: #059669; font-weight: bold; background: #ECFDF5; padding: 10px; border-radius: 8px;">
                    تم الحفظ بنجاح! شكراً لك.
                </div>
            </div>

            <!-- سؤال السعر -->
            <div style="margin-top: 2rem;">
                <p style="font-weight: 600; margin-bottom: 1rem;">لو توفر بسعر <span id="price-tag" style="color: var(--primary);"></span> هل تشتريه؟</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="alert('شكراً لرأيك!')" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #ddd; background: #fff;">نعم</button>
                    <button onclick="alert('شكراً لرأيك!')" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #ddd; background: #fff;">ربما</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== المنطق البرمجي (Javascript) ===== -->
    <script>
        // === 1. قاعدة البيانات (محاكاة لما سيأتي من الـ Backend) ===
        const DB = {
            // المتجر الافتراضي (حقائب)
            "demo": {
                meta: { name: "TravelGuard", color: "#2563EB", logo: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
                product: {
                    name: "الحقيبة الآمنة",
                    title: "سافر بأمان وثقة تامة.. وداعاً للقلق",
                    desc: "الحقيبة الوحيدة المصممة هندسياً لتكون مستحيلة الفتح وأنت ترتديها.",
                    img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80",
                    video: null, // لا يوجد فيديو
                    pain: "السرقة في الأماكن المزدحمة",
                    features: ["سحابات مخفية تماماً", "منفذ شحن USB خارجي", "ضد الماء والقطع"],
                    price: "249 ر.س"
                },
                marketing: { signal: "ارتفاع الطلب 40% هذا الشهر", offerTitle: "خصم 20% للإطلاق", offerSub: "لأول 50 طلب فقط" }
            },
            
            // متجر القهوة (لتجربة الفيديو وتغير الألوان)
            "coffee": {
                meta: { name: "أريب للقهوة", color: "#78350F", logo: "" }, // بني
                product: {
                    name: "الكوب الذكي",
                    title: "قهوتك ساخنة.. من أول رشفة لآخر رشفة",
                    desc: "لا داعي لتسخين القهوة 10 مرات. الكوب الذكي يحفظ الحرارة تلقائياً طوال اليوم.",
                    img: "", // سيتم استبدالها بالفيديو
                    video: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&showinfo=0&rel=0", // رابط يوتيوب Embed
                    pain: "برودة القهوة أثناء العمل",
                    features: ["شحن لاسلكي سريع", "تحكم بالحرارة عبر التطبيق", "تصميم سيراميك فاخر"],
                    price: "180 ر.س"
                },
                marketing: { signal: "المنتج الأكثر طلباً للمكاتب", offerTitle: "عرض 1 + 1 مجاناً", offerSub: "لفترة محدودة جداً" }
            }
        };

        // === 2. التشغيل والتحضير ===
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('store') || 'demo';
        const data = DB[storeId] || DB['demo'];
        let activeMethod = 'email';

        function init() {
            // تعيين الألوان
            document.documentElement.style.setProperty('--primary', data.meta.color);
            
            // الهيدر
            if(data.meta.logo) {
                document.getElementById('store-logo').src = data.meta.logo;
                document.getElementById('store-logo').classList.remove('hidden');
            } else {
                document.getElementById('store-name').innerText = data.meta.name;
                document.getElementById('store-name').classList.remove('hidden');
            }
            document.title = data.product.name;

            // الفيديو والصور (الذكاء هنا)
            if(data.product.video) {
                // إذا كان هناك فيديو، اخفِ الصورة واعرض الفيديو
                document.getElementById('hero-image').classList.add('hidden');
                document.getElementById('video-box').innerHTML = `<iframe src="${data.product.video}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                document.getElementById('video-box').classList.remove('hidden');
            } else {
                // إذا لم يوجد فيديو، اعرض الصورة
                document.getElementById('hero-image').src = data.product.img;
            }

            // النصوص
            document.getElementById('market-signal').innerText = data.marketing.signal;
            document.getElementById('badge-box').classList.remove('hidden');
            
            document.getElementById('hero-title').innerText = data.product.title;
            document.getElementById('hero-desc').innerText = data.product.desc;
            document.getElementById('pain-txt').innerText = data.product.pain;
            document.getElementById('prod-name-small').innerText = data.product.name;
            
            // المميزات
            const ul = document.getElementById('features-list');
            data.product.features.forEach(feat => {
                let li = document.createElement('li');
                li.innerText = feat;
                ul.appendChild(li);
            });

            // العرض والسعر
            document.getElementById('offer-title').innerText = data.marketing.offerTitle;
            document.getElementById('offer-sub').innerText = data.marketing.offerSub;
            document.getElementById('price-tag').innerText = data.product.price;

            // إخفاء اللودر
            setTimeout(() => document.getElementById('loader').style.display = 'none', 600);
        }

        // === 3. التفاعلات ===
        function goToCapture() {
            document.getElementById('view-1').classList.add('hidden');
            document.getElementById('view-2').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function setTab(method) {
            activeMethod = method;
            // تبديل الأزرار
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // تبديل الحقول
            if(method === 'email') {
                document.getElementById('field-email').classList.remove('hidden');
                document.getElementById('field-whatsapp').classList.add('hidden');
            } else {
                document.getElementById('field-email').classList.add('hidden');
                document.getElementById('field-whatsapp').classList.remove('hidden');
            }
        }

        function submitLead() {
            let value = "";
            let extra = ""; // للدولة
            
            if(activeMethod === 'email') {
                value = document.getElementById('inp-email').value;
            } else {
                extra = document.getElementById('country-code').value;
                value = document.getElementById('inp-whatsapp').value;
            }

            if(value.length > 3) {
                // هنا سترسل البيانات للباك إند
                console.log(`تم جمع البيانات: ${extra} ${value} (النوع: ${activeMethod})`);
                
                // إظهار النجاح
                document.getElementById('success-msg').classList.remove('hidden');
                // إخفاء الزر لمنع التكرار
                event.target.style.display = 'none';
            } else {
                alert("يرجى إدخال بيانات صحيحة");
            }
        }

        // تشغيل التطبيق
        init();

    </script>
</body>
</html>
